    get:
      tags: [Course Offerings]
      summary: Show a course offering (staff any; instructor own)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Course offering found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CourseOffering' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Course Offerings]
      summary: Update a course offering (administrator / registrar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseOfferingUpdate' }
      responses:
        '200':
          description: Course offering updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CourseOffering' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      $ref: '#/paths/~1course-offerings~1{id}/put'
    delete:
      tags: [Course Offerings]
      summary: Deactivate a course offering (returns 204)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deactivated; no content }
        '403': { $ref: '#/components/responses/Forbidden' }
  /course-offerings/{id}/students:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Course Offerings]
      summary: List enrolled students in an offering (staff or the offering's instructor)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Enrolled students (with grades if encoded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        enrollment_id: { type: integer }
                        enrollment_date: { type: string, format: date, nullable: true }
                        student: { $ref: '#/components/schemas/Student' }
                        grade: { $ref: '#/components/schemas/Grade' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /students:
