openapi: 3.0.3
info:
  title: Student Information Management System API
  description: |
    REST API for the Student Information Management System (SIMS).

    **Roles**: `administrator`, `registrar`, `instructor`, `student`.

    **Response envelope**: every 2xx/4xx response follows
    `{ "success": bool, "message": string, "data": ..., "meta": ..., "errors": ... }`.

    **Authentication**: Bearer token issued by `POST /api/v1/auth/login`
    (header `Authorization: Bearer <token>`).

    **Pagination** (list endpoints):
    `page`, `per_page` (default 15, max 100) query parameters.
    **Search**: `search` matches searchable columns (LIKE).
    **Filter**: filterable columns passed as query parameters.
    **Sort**: `sort=<column>&order=asc|desc`.

    Deactivating records (`DELETE`) soft-deactivates (`status = inactive`)
    and returns `204 No Content` to preserve referential integrity.
  version: 1.0.0
  contact:
    name: SIMS Backend
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local development server

tags:
  - name: Authentication
  - name: Dashboard
  - name: Programs
  - name: Courses
  - name: Academic Terms
  - name: Course Offerings
  - name: Students
  - name: Enrollments
  - name: Grades
  - name: Academic Record
  - name: Student Self-Service

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current bearer token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Role-aware dashboard statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/StaffStats'
                      - $ref: '#/components/schemas/InstructorStats'
                      - $ref: '#/components/schemas/StudentStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /programs:
    get:
      tags: [Programs]
      summary: List programs (search / filter / sort / paginate)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/ProgramPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Programs]
      summary: Create a program (administrator / registrar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramStore' }
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Program' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /programs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Programs]
      summary: Show a program
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Program found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Program' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Programs]
      summary: Update a program (administrator / registrar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramUpdate' }
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Program' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      $ref: '#/paths/~1programs~1{id}/put'
    delete:
      tags: [Programs]
      summary: Deactivate a program (returns 204)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deactivated; no content }
        '403': { $ref: '#/components/responses/Forbidden' }

