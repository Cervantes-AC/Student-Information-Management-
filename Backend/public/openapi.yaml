      summary: Update a student (administrator / registrar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentUpdate' }
      responses:
        '200':
          description: Student updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Student' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      $ref: '#/paths/~1students~1{id}/put'
    delete:
      tags: [Students]
      summary: Deactivate a student (returns 204)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deactivated; no content }
        '403': { $ref: '#/components/responses/Forbidden' }
  /students/{id}/enrollments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Students]
      summary: List a student's enrollments (staff any; student own)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Student enrollments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}/grades:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Students]
      summary: List a student's grades (staff any; student own)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Student grades
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Grade'
                        - type: object
                          properties:
                            course:
                              type: object
                              nullable: true
                              properties:
                                course_code: { type: string }
                                course_title: { type: string }
                            section: { type: string, nullable: true }
                            academic_term: { $ref: '#/components/schemas/AcademicTerm' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}/academic-record:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Academic Record]
      summary: Get a student's academic record grouped by term (staff any; student own)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Academic record with per-term and overall averages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AcademicRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enrollments:
    get:
      tags: [Enrollments]
      summary: List enrollments (administrator / registrar)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Enrollment page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Enrollment' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Enrollments]
      summary: Enroll a student in an offering (administrator / registrar)
      security: [{ bearerAuth: [] }]
      description: Returns `409` when the student is already enrolled in the offering.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentStore' }
      responses:
        '201':
          description: Enrollment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /enrollments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Enrollments]
      summary: Show an enrollment (administrator / registrar)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Enrollment found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Enrollments]
      summary: Update enrollment status/date (administrator / registrar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentUpdate' }
      responses:
        '200':
          description: Enrollment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      $ref: '#/paths/~1enrollments~1{id}/put'
    delete:
      tags: [Enrollments]
      summary: Drop an enrollment (deactivate, returns 204)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Dropped; no content }
        '403': { $ref: '#/components/responses/Forbidden' }

  /grades:
    get:
      tags: [Grades]
      summary: List grades (administrator / registrar)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Grade page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Grade' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Grades]
      summary: Encode a grade (staff, or instructor for their own offering's students)
      security: [{ bearerAuth: [] }]
      description: Returns `409` when the enrollment already has a grade record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeStore' }
      responses:
        '201':
          description: Grade recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Grade' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /grades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Grades]
      summary: Show a grade (administrator / registrar)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Grade found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Grade' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Grades]
      summary: Update a grade (staff, or instructor for their own offering's students)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeUpdate' }
      responses:
        '200':
          description: Grade updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Grade' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      $ref: '#/paths/~1grades~1{id}/put'

  /my/enrollments:
    get:
      tags: [Student Self-Service]
      summary: Current student's enrollments (student role)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own enrollments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /my/grades:
    get:
      tags: [Student Self-Service]
      summary: Current student's grades (student role)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own grades
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Grade'
                        - type: object
                          properties:
                            course: { $ref: '#/components/schemas/Course' }
                            section: { type: string }
                            academic_term: { $ref: '#/components/schemas/AcademicTerm' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /my/academic-record:
    get:
      tags: [Student Self-Service]
      summary: Current student's academic record (student role)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own academic record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AcademicRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Record ID
    Search:
      name: search
      in: query
      schema: { type: string }
      description: Full-text-ish (LIKE) search across searchable columns
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    Sort:
      name: sort
      in: query
      schema: { type: string }
      description: Sort column (allowed columns per endpoint)
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }
    ProgramIdFilter:
      name: program_id
      in: query
      schema: { type: integer }
      description: Filter students by program
    YearLevelFilter:
      name: year_level
      in: query
      schema: { type: integer }
      description: Filter students by year level
    StatusFilter:
      name: status
      in: query
      schema: { type: string, enum: [active, inactive] }
      description: Filter by record status

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed for this role / record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicting/duplicate record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    ApiOk:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { nullable: true }
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
      example:
        success: false
        message: Validation failed.
        errors:
          student_number: ["The student number field is required."]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@sims.test }
        password: { type: string, format: password, example: password }
    LoginResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            token:
              type: string
              description: Bearer token for Authorization header
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [administrator, registrar, instructor, student]
        role_label: { type: string }
        status:
          type: string
          enum: [active, inactive]
        student_id: { type: integer, nullable: true }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        from: { type: integer, nullable: true }
        to: { type: integer, nullable: true }

    Program:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProgramStore:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000, nullable: true }
        status: { type: string, enum: [active, inactive] }
    ProgramUpdate:
      type: object
      properties:
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000, nullable: true }
        status: { type: string, enum: [active, inactive] }

    Course:
      type: object
      properties:
        id: { type: integer }
        course_code: { type: string }
        course_title: { type: string }
        description: { type: string, nullable: true }
        units: { type: number, example: 3.0 }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CourseStore:
      type: object
      required: [course_code, course_title]
      properties:
        course_code: { type: string, maxLength: 20 }
        course_title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000, nullable: true }
        units: { type: number, minimum: 0.5, maximum: 10, default: 3.0 }
        status: { type: string, enum: [active, inactive] }
    CourseUpdate:
      type: object
      properties:
        course_code: { type: string, maxLength: 20 }
        course_title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000, nullable: true }
        units: { type: number, minimum: 0.5, maximum: 10 }
        status: { type: string, enum: [active, inactive] }

    AcademicTerm:
      type: object
      properties:
        id: { type: integer }
        academic_year: { type: string, example: "2025-2026" }
        semester: { type: string, enum: ["1st", "2nd", Summer] }
        display_name: { type: string, example: "1st Semester, S.Y. 2025-2026" }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, inactive] }
    AcademicTermStore:
      type: object
      required: [academic_year, semester]
      properties:
        academic_year: { type: string, maxLength: 20 }
        semester: { type: string, enum: ["1st", "2nd", Summer] }
        start_date: { type: string, format: date, nullable: true }
        end_date:
          type: string
          format: date
          nullable: true
          description: Must be on or after start_date
        status: { type: string, enum: [active, inactive] }
    AcademicTermUpdate:
      type: object
      properties:
        academic_year: { type: string, maxLength: 20 }
        semester: { type: string, enum: ["1st", "2nd", Summer] }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, inactive] }

    Student:
      type: object
      properties:
        id: { type: integer }
        student_number: { type: string }
        full_name: { type: string }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        suffix: { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        email: { type: string, format: email, nullable: true }
        contact_number: { type: string, nullable: true }
        address: { type: string, nullable: true }
        program_id: { type: integer }
        program:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
        year_level: { type: integer, minimum: 1, maximum: 5 }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StudentStore:
      type: object
      required: [student_number, first_name, last_name, program_id, year_level]
      properties:
        student_number: { type: string, maxLength: 20 }
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255 }
        suffix: { type: string, maxLength: 20, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        email: { type: string, format: email, maxLength: 255, nullable: true }
        contact_number: { type: string, maxLength: 30, nullable: true }
        address: { type: string, maxLength: 1000, nullable: true }
        program_id: { type: integer }
        year_level: { type: integer, minimum: 1, maximum: 5 }
        status: { type: string, enum: [active, inactive] }
    StudentUpdate:
      type: object
      properties:
        student_number: { type: string, maxLength: 20 }
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255 }
        suffix: { type: string, maxLength: 20, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        email: { type: string, format: email, maxLength: 255, nullable: true }
        contact_number: { type: string, maxLength: 30, nullable: true }
        address: { type: string, maxLength: 1000, nullable: true }
        program_id: { type: integer }
        year_level: { type: integer, minimum: 1, maximum: 5 }
        status: { type: string, enum: [active, inactive] }

    CourseOffering:
      type: object
      properties:
        id: { type: integer }
        section: { type: string }
        schedule: { type: string, nullable: true }
        room: { type: string, nullable: true }
        capacity: { type: integer }
        status: { type: string, enum: [active, inactive] }
        course:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            course_code: { type: string }
            course_title: { type: string }
            units: { type: number }
        academic_term:
          $ref: '#/components/schemas/AcademicTerm'
        instructor:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
        created_at: { type: string, format: date-time }
    CourseOfferingStore:
      type: object
      required: [course_id, academic_term_id, instructor_id, section]
      properties:
        course_id: { type: integer }
        academic_term_id: { type: integer }
        instructor_id:
          type: integer
          description: Must reference a user with role instructor
        section: { type: string, maxLength: 20 }
        schedule: { type: string, maxLength: 100, nullable: true }
        room: { type: string, maxLength: 50, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 500, default: 40 }
        status: { type: string, enum: [active, inactive] }
    CourseOfferingUpdate:
      type: object
      properties:
        course_id: { type: integer }
        academic_term_id: { type: integer }
        instructor_id:
          type: integer
          description: Must reference a user with role instructor
        section: { type: string, maxLength: 20 }
        schedule: { type: string, maxLength: 100, nullable: true }
        room: { type: string, maxLength: 50, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        status: { type: string, enum: [active, inactive] }

    Enrollment:
      type: object
      properties:
        id: { type: integer }
        enrollment_date: { type: string, format: date, nullable: true }
        status:
          type: string
          enum: [enrolled, dropped, completed]
        student:
          $ref: '#/components/schemas/Student'
        course_offering:
          $ref: '#/components/schemas/CourseOffering'
        grade:
          $ref: '#/components/schemas/Grade'
    EnrollmentStore:
      type: object
      required: [student_id, course_offering_id]
      properties:
        student_id: { type: integer }
        course_offering_id: { type: integer }
        enrollment_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [enrolled, dropped, completed] }
    EnrollmentUpdate:
      type: object
      properties:
        enrollment_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [enrolled, dropped, completed] }

    Grade:
      type: object
      properties:
        id: { type: integer }
        enrollment_id: { type: integer }
        midterm_grade: { type: number, minimum: 1, maximum: 5, nullable: true }
        final_grade: { type: number, minimum: 1, maximum: 5, nullable: true }
        remarks: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GradeStore:
      type: object
      required: [enrollment_id]
      properties:
        enrollment_id: { type: integer }
        midterm_grade: { type: number, minimum: 1, maximum: 5, nullable: true }
        final_grade: { type: number, minimum: 1, maximum: 5, nullable: true }
        remarks: { type: string, maxLength: 255, nullable: true }
    GradeUpdate:
      type: object
      properties:
        midterm_grade: { type: number, minimum: 1, maximum: 5, nullable: true }
        final_grade: { type: number, minimum: 1, maximum: 5, nullable: true }
        remarks: { type: string, maxLength: 255, nullable: true }

    AcademicRecord:
      type: object
      properties:
        student:
          $ref: '#/components/schemas/Student'
        terms:
          type: array
          items:
            type: object
            properties:
              academic_term:
                $ref: '#/components/schemas/AcademicTerm'
              average:
                type: number
                nullable: true
                description: Mean grade point for graded courses in the term
              courses:
                type: array
                items:
                  type: object
                  properties:
                    enrollment_id: { type: integer }
                    status: { type: string }
                    course:
                      type: object
                      nullable: true
                      properties:
                        course_code: { type: string }
                        course_title: { type: string }
                        units: { type: number }
                    section: { type: string, nullable: true }
                    midterm_grade: { type: number, nullable: true }
                    final_grade: { type: number, nullable: true }
                    remarks: { type: string, nullable: true }
                    grade_point: { type: number, nullable: true }
        overall_average:
          type: number
          nullable: true
          description: Unit-weighted general weighted average across terms

    StaffStats:
      type: object
      properties:
        students: { type: integer }
        programs: { type: integer }
        courses: { type: integer }
        academic_terms: { type: integer }
        course_offerings: { type: integer }
        enrollments: { type: integer }
        active_enrollments: { type: integer }
        instructors: { type: integer }
    InstructorStats:
      type: object
      properties:
        assigned_offerings: { type: integer }
        enrolled_students: { type: integer }
        grades_encoded: { type: integer }
    StudentStats:
      type: object
      properties:
        enrollments: { type: integer }
        active_enrollments: { type: integer }
        grades_encoded: { type: integer }