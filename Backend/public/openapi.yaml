  /course-offerings:
    get:
      tags: [Course Offerings]
      summary: List course offerings (staff all; instructor sees own)
      security: [{ bearerAuth: [] }]
      description: |
        Administrators/registrars see all offerings; instructors are
        automatically scoped to the offerings assigned to them.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Course offering page
          content:
            application/json:
              schema:
                type: object
                properties:
