    get:
      tags: [Students]
      summary: Show a student (staff any; student their own record only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Student found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Student' }
        '403': { $ref: '#/components/responses/Forbidden' }
