                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Courses]
      summary: Create a course (administrator / registrar)
      security: [{ bearerAuth: [] }]
