                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Course' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Courses]
      summary: Update a course (administrator / registrar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseUpdate' }
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Course' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      $ref: '#/paths/~1courses~1{id}/put'
    delete:
      tags: [Courses]
      summary: Deactivate a course (returns 204)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deactivated; no content }
        '403': { $ref: '#/components/responses/Forbidden' }

  /academic-terms:
    get:
